<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spirit Drift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{height:100%;width:100%;background:#000;overflow:hidden;touch-action:manipulation;}
canvas{display:block;background:#000;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="ps1"></canvas>
<script>
const c=document.getElementById('ps1'),x=c.getContext('2d');
c.width=400;c.height=700;
const pal={fog:'#1a0f2e',skull:'#2a1b3d',glow:'#4a2880',light:'#7c3aed'};

let camX=0,camY=0,targetX=0,targetY=0,depth=0;
let objs=[];
let touchX=null,touchY=null;

// Spawn floating skull lanterns
function SpawnObject(z){
  const type=Math.random()>0.7?'post':'skull';
  objs.push({
    x:(Math.random()-0.5)*140,
    y:(Math.random()-0.5)*80,
    z:z||450,
    type:type,
    size:type==='skull'?14:8
  });
}
for(let i=0;i<18;i++)SpawnObject(i*25);

// Input
document.addEventListener('touchstart',e=>{e.preventDefault();touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:false});
document.addEventListener('touchend',e=>{e.preventDefault();touchX=null;touchY=null;},{passive:false});
document.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();targetX=((e.clientX-r.left)/r.width-0.5)*70;targetY=((e.clientY-r.top)/r.height-0.5)*30;});

function loop(){
  depth+=1.2;
  camX+=(targetX-camX)*0.06;
  camY+=(targetY-camY)*0.06;

  // Touch steering
  if(touchX!==null){
    const r=c.getBoundingClientRect();
    targetX=((touchX-r.left)/r.width-0.5)*90;
    targetY=((touchY-r.top)/r.height-0.5)*45;
  }

  // Clear with fog gradient
  const grad=x.createLinearGradient(0,0,0,700);
  grad.addColorStop(0,'#000');
  grad.addColorStop(1,pal.fog);
  x.fillStyle=grad;
  x.fillRect(0,0,400,700);

  // Update & draw objects — farthest first
  objs.forEach(o=>{
    o.z-=1.2;
    if(o.z<-20){SpawnObject(450);objs.splice(objs.indexOf(o),1);}
    const scale=160/(o.z+80);
    const sx=200+(o.x-camX)*scale;
    const sy=350+(o.y-camY)*scale;
    const alpha=Math.min(1,Math.max(0,(o.z-60)/350));

    if(sx>-50&&sx<450&&sy>-50&&sy<750){
      x.globalAlpha=alpha;
      if(o.type==='skull'){
        x.fillStyle=pal.skull;
        x.fillRect(sx-o.size*scale*0.5,sy-o.size*scale*0.4,o.size*scale,o.size*scale*0.7);
        x.fillStyle=pal.glow;
        x.fillRect(sx-o.size*scale*0.3,sy-o.size*scale*0.25,2*scale,2*scale);
        x.fillRect(sx+o.size*scale*0.1,sy-o.size*scale*0.25,2*scale,2*scale);
        x.fillStyle=pal.light+'20';
        x.beginPath();x.arc(sx,sy,o.size*scale*0.9,0,Math.PI*2);x.fill();
      }else{
        x.fillStyle=pal.glow;
        x.fillRect(sx-1*scale,sy-o.size*scale,2*scale,o.size*scale*2);
        x.fillRect(sx-o.size*scale*0.4,sy-o.size*scale*0.5,o.size*scale*0.8,2*scale);
      }
    }
  });
  x.globalAlpha=1;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
