<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skull Grove Shooter — Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1226;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;cursor:pointer;}
canvas{background:linear-gradient(180deg,#2e1b4a,#1a1226);border-radius:16px;border:4px solid #4b3669;max-width:100%;max-height:90vh;}
</style>
</head>
<body onclick="window.location.href='skullgroveshooter.html'">
<canvas id="c" width="420" height="720"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let p={x:210,y:630,size:32,growth:0},buds=[],threats=[],frame=0,time=0;

function shootAuto(){buds.push({x:p.x,y:p.y-22,size:6+Math.random()*4,speed:-9,hue:85+Math.random()*25,wobble:Math.random()*Math.PI*2});}
function spawnThreat(){const t=['blight','shadow','thorns'];threats.push({x:35+Math.random()*350,y:-35,w:28+Math.random()*22,h:28+Math.random()*22,speed:1.4+Math.random()*2.4,type:t[Math.floor(Math.random()*t.length)],rot:Math.random()*Math.PI*2,rotSp:(Math.random()-0.5)*0.06});}
function drawSkullPlant(px,py,sz,gr){x.save();x.translate(px,py);x.shadowColor='#6b7a5d';x.shadowBlur=12+gr*2;x.strokeStyle='#8a9b6b';x.lineWidth=4;x.beginPath();x.moveTo(0,sz*0.55);x.quadraticCurveTo(-5,sz*0.15,0,-sz*0.05);x.stroke();x.fillStyle='#6b7a5d';x.beginPath();x.ellipse(-11,sz*0.35,12+gr,6,-0.6,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(13,sz*0.28,10+gr,5,0.5,0,Math.PI*2);x.fill();x.fillStyle='#e4e0eb';x.beginPath();x.ellipse(0,0,sz*0.48,sz*0.52,0,0,Math.PI*2);x.fill();x.fillStyle='#1a1226';x.beginPath();x.ellipse(-sz*0.18,-sz*0.05,sz*0.12,sz*0.15,-0.1,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(sz*0.18,-sz*0.05,sz*0.12,sz*0.15,0.1,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(0,sz*0.1);x.lineTo(-sz*0.06,sz*0.18);x.lineTo(sz*0.06,sz*0.18);x.closePath();x.fill();x.fillStyle='#d4d4d8';for(let i=-2;i<=2;i++)x.fillRect(i*7-2,sz*0.22,4,5);x.fillStyle='#9ab98a';x.beginPath();x.moveTo(0,-sz*0.42);x.lineTo(-4,-sz*0.3);x.lineTo(4,-sz*0.3);x.closePath();x.fill();x.restore();}
function loop(timestamp){
  time++;
  frame++;

  p.x=210+Math.sin(time/90)*110;
  p.x=Math.max(45,Math.min(375,p.x));
  p.growth=Math.min(12,3+Math.sin(time/120)*2);

  frame%50===0&&shootAuto();
  frame%45===0&&spawnThreat();

  buds=buds.filter(b=>{b.y+=b.speed;b.wobble+=0.1;return b.y>-20;});
  threats=threats.filter(t=>{
    t.y+=t.speed;t.rot+=t.rotSp;
    for(let i=buds.length-1;i>=0;i--){
      const d=Math.hypot(buds[i].x-t.x,buds[i].y-t.y);
      if(d<(buds[i].size+t.w)/2){buds.splice(i,1);return false;}
    }
    return t.y<780;
  });

  if(time>1800){
    buds=[];threats=[];time=0;frame=0;
  }

  x.fillStyle='rgba(26,18,38,0.08)';x.fillRect(0,0,420,720);
  drawSkullPlant(p.x,p.y,p.size,p.growth);
  buds.forEach(b=>{x.save();x.translate(b.x+Math.sin(b.wobble)*1.5,b.y);x.fillStyle=`hsl(${b.hue},55%,65%)`;x.shadowColor=`hsl(${b.hue},65%,75%)`;x.shadowBlur=8;x.beginPath();x.ellipse(0,0,b.size*0.6,b.size,0,0,Math.PI*2);x.fill();x.restore();});
  const c={blight:'rgba(90,55,45,0.55)',shadow:'rgba(45,25,70,0.55)',thorns:'rgba(75,55,35,0.55)'};
  threats.forEach(t=>{x.save();x.translate(t.x,t.y);x.rotate(t.rot);x.fillStyle=c[t.type];x.shadowColor=t.type==='shadow'?'#372554':'#5c473a';x.shadowBlur=6;x.beginPath();const s=5+Math.floor(Math.random()*3);for(let i=0;i<s;i++){const a=(i/s)*Math.PI*2,r=t.w/2*(0.65+Math.sin(i*2.5+t.rot)*0.35);i===0?x.moveTo(Math.cos(a)*r,Math.sin(a)*r):x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.closePath();x.fill();x.restore();});

  x.fillStyle='#d4c8b5';x.font='bold 16px Courier New';x.textAlign='center';x.globalAlpha=0.4+Math.sin(time/45)*0.15;
  x.fillText('Tap anywhere to begin',210,680);x.globalAlpha=1;

  requestAnimationFrame(loop);
}
loop(0);
</script>
</body>
</html>
