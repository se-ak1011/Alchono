<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth Shield — Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1226;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;cursor:pointer;}
canvas{background:linear-gradient(180deg,#2e1b4a,#1a1226);border-radius:16px;border:4px solid #4b3669;max-width:100%;max-height:90vh;}
</style>
</head>
<body onclick="window.location.href='growthshield.html'">
<canvas id="c" width="420" height="720"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let p={x:210,y:360,size:30},things=[],frame=0,time=0;

function spawn(){const g=Math.random()<0.35;things.push({x:35+Math.random()*350,y:-35,w:g?22:32,h:g?22:32,s:1.5+Math.random()*2.5,good:g});}
function drawSkull(px,py,sz){x.save();x.translate(px,py);x.fillStyle='#e4e0eb';x.shadowColor='#7c609b';x.shadowBlur=8;x.beginPath();x.ellipse(0,0,sz*0.45,sz*0.5,0,0,Math.PI*2);x.fill();x.fillStyle='#1a1226';x.beginPath();x.ellipse(-sz*0.18,-sz*0.05,sz*0.11,sz*0.14,0,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(sz*0.18,-sz*0.05,sz*0.11,sz*0.14,0,0,Math.PI*2);x.fill();x.fillStyle='#8a9b6b';x.beginPath();x.ellipse(-sz*0.3,sz*0.25,10,5,-0.5,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(sz*0.25,sz*0.2,8,4,0.4,0,Math.PI*2);x.fill();x.restore();}
function loop(){
  time++;frame++;
  p.x=210+Math.sin(time/75)*130;
  p.y=360+Math.cos(time/100)*150;
  p.x=Math.max(45,Math.min(375,p.x));
  p.y=Math.max(45,Math.min(675,p.y));

  frame%35===0&&spawn();
  things=things.filter(t=>{
    t.y+=t.s;
    const d=Math.hypot(p.x-t.x,p.y-t.y);
    if(d<(p.size+t.w)/2)return false;
    return t.y<780;
  });

  if(time>1600){things=[];time=0;frame=0;}

  x.clearRect(0,0,420,720);
  drawSkull(p.x,p.y,p.size);
  things.forEach(t=>{
    x.fillStyle=t.good?'#9ab98a':'rgba(90,55,45,0.55)';
    x.shadowColor=t.good?'#6b7a5d':'#5c473a';
    x.shadowBlur=6;
    x.beginPath();
    x.arc(t.x,t.y,t.w/2,0,Math.PI*2);
    x.fill();
  });

  x.fillStyle='#d4c8b5';x.font='bold 16px Courier New';x.textAlign='center';
  x.globalAlpha=0.4+Math.sin(time/45)*0.15;
  x.fillText('Tap anywhere to begin',210,680);x.globalAlpha=1;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
